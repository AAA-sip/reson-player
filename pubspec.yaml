name: reson
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  adaptive_theme: ^3.7.2
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2
  flex_seed_scheme: ^4.0.1
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.2.2
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.0.1
  google_fonts: ^7.0.2
  intl: ^0.20.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  logger: ^2.6.2
  material_design: ^0.28.1
  material_shapes: ^0.0.2
  material_symbols_icons: ^4.2892.0
  permission_handler: ^12.0.1
  riverpod: ^3.3.2
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  flutter:
    sdk: flutter
  on_audio_query:
    git:
      url: https://github.com/rozpo/on_audio_query
      path: packages/on_audio_query
      ref: main

dev_dependencies:
  freezed: ^3.2.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex/RobotoFlex.ttf

  assets:
    - .env
    - assets/
    - assets/fonts/RobotoFlex/
